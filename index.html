<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Grid Showcase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body { background-color: #09090b; color: #f4f4f5; font-family: 'Inter', sans-serif; }
        
        /* Magic trick to scale iframes to look like thumbnail images */
        .iframe-preview {
            width: 200%;
            height: 200%;
            transform: scale(0.5);
            transform-origin: top left;
            border: none;
            pointer-events: none; /* Prevents lag when scrolling over them */
            background-color: #ffffff; /* Most components assume white bg */
        }
        
        /* Dark mode for the preview container if the component is transparent */
        .preview-container {
            background-image: radial-gradient(#27272a 1px, transparent 1px);
            background-size: 20px 20px;
            background-color: #09090b;
        }
    </style>
</head>
<body class="min-h-screen bg-zinc-950 flex flex-col" x-data="galleryApp()">

    <!-- Sticky Header -->
    <header class="sticky top-0 z-50 bg-zinc-950/80 backdrop-blur-xl border-b border-zinc-800">
        <div class="max-w-[1600px] mx-auto px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center">
                    <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center mr-3 shadow-lg shadow-indigo-500/20">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z"></path></svg>
                    </div>
                    <h1 class="text-xl font-bold tracking-tight text-white">Aura Library</h1>
                </div>

                <!-- Search -->
                <div class="flex-1 max-w-md mx-8">
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-4 w-4 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </div>
                        <input type="text" x-model="searchQuery" placeholder="Search by name..." class="block w-full pl-10 pr-3 py-2 border border-zinc-800 rounded-xl leading-5 bg-zinc-900/50 text-zinc-300 placeholder-zinc-500 focus:outline-none focus:bg-zinc-900 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 sm:text-sm transition-colors">
                    </div>
                </div>

                <!-- Total Count -->
                <div class="text-sm text-zinc-400 font-medium bg-zinc-900 px-3 py-1 rounded-full border border-zinc-800">
                    <span x-text="totalDisplayed"></span> items
                </div>
            </div>

            <!-- Main Categories Tab -->
            <div class="flex space-x-8 -mb-px overflow-x-auto scrollbar-hide">
                <template x-for="cat in Object.keys(data)" :key="cat">
                    <button 
                        @click="setActiveCat(cat)" 
                        :class="activeCat === cat ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-zinc-400 hover:text-zinc-200 hover:border-zinc-700'"
                        class="whitespace-nowrap pb-4 px-1 border-b-2 font-medium text-sm transition-colors"
                        x-text="cat">
                    </button>
                </template>
            </div>
        </div>
    </header>

    <!-- Subcategories Tab -->
    <div class="bg-zinc-900 border-b border-zinc-800 shadow-sm" x-show="activeCat && data[activeCat]">
        <div class="max-w-[1600px] mx-auto px-6 lg:px-8 py-3">
            <div class="flex space-x-2 overflow-x-auto scrollbar-hide">
                <button 
                    @click="activeSub = 'ALL'"
                    :class="activeSub === 'ALL' ? 'bg-indigo-500/10 text-indigo-400 border-indigo-500/30' : 'bg-zinc-950 text-zinc-400 border-zinc-800 hover:border-zinc-700 hover:text-zinc-200'"
                    class="whitespace-nowrap px-4 py-1.5 rounded-full border text-xs font-semibold transition-colors">
                    All Items
                </button>
                <template x-for="subCat in Object.keys(data[activeCat] || {})" :key="subCat">
                    <button 
                        @click="activeSub = subCat"
                        :class="activeSub === subCat ? 'bg-indigo-500/10 text-indigo-400 border-indigo-500/30' : 'bg-zinc-950 text-zinc-400 border-zinc-800 hover:border-zinc-700 hover:text-zinc-200'"
                        class="whitespace-nowrap px-4 py-1.5 rounded-full border text-xs font-semibold transition-colors"
                        x-text="subCat">
                    </button>
                </template>
            </div>
        </div>
    </div>

    <!-- Main Grid Content -->
    <main class="flex-1 max-w-[1600px] w-full mx-auto px-6 lg:px-8 py-8">
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <template x-for="item in filteredItems" :key="item.path">
                
                <!-- Card -->
                <div class="group flex flex-col bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden hover:border-indigo-500/50 hover:shadow-lg hover:shadow-indigo-500/10 transition-all duration-300 transform hover:-translate-y-1">
                    
                    <!-- Preview Box -->
                    <div class="preview-container relative w-full h-64 overflow-hidden">
                        
                        <!-- The iframe uses loading="lazy" so hundreds of them won't crash the PC -->
                        <iframe 
                            :src="item.path" 
                            loading="lazy" 
                            sandbox="allow-scripts allow-same-origin"
                            scrolling="no"
                            class="iframe-preview">
                        </iframe>
                        
                        <!-- Overlay that appears on hover to open full view -->
                        <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col items-center justify-center z-10 backdrop-blur-[2px]">
                            <a :href="item.path" target="_blank" class="transform translate-y-4 group-hover:translate-y-0 transition-all duration-300 bg-white text-zinc-950 hover:bg-indigo-500 hover:text-white px-5 py-2.5 rounded-full font-semibold shadow-xl flex items-center">
                                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                                Open Full Screen
                            </a>
                            
                            <p class="text-zinc-300 text-xs mt-3 opacity-80" x-text="'Path: ' + item.path.split('/').pop()"></p>
                        </div>
                    </div>
                    
                    <!-- Card Footer -->
                    <div class="p-4 border-t border-zinc-800 bg-zinc-950/80 flex items-center justify-between">
                        <h3 class="text-sm font-semibold text-zinc-200 truncate pr-2" x-text="item.name" :title="item.name"></h3>
                        <div class="shrink-0 w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]"></div>
                    </div>
                </div>

            </template>
        </div>
        
        <!-- Empty State -->
        <div x-show="filteredItems.length === 0" class="text-center py-20">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-zinc-900 border border-zinc-800 mb-4">
                <svg class="w-8 h-8 text-zinc-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
            <h3 class="text-lg font-medium text-zinc-300">No matching items found</h3>
            <p class="text-zinc-500 mt-2">Try adjusting your search query.</p>
        </div>

    </main>
