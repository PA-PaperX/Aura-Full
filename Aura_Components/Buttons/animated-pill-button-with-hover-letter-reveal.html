<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Component Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      height: 100%;
      overflow: auto;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000000;
      color: #ffffff;
    }
    .component-wrapper {
      width: 100%;
      height: 100%;
      padding: 0;
      box-sizing: border-box;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div class="component-wrapper">
    <html><head><style>
.btn-53,
.btn-53 *,
.btn-53 :after,
.btn-53 :before,
.btn-53:after,
.btn-53:before {
  border: 0 solid;
  box-sizing: border-box;
}

/* base reset */
.btn-53 {
  -webkit-tap-highlight-color: transparent;
  -webkit-appearance: button;
  background-image: none;
  cursor: pointer;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
    Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 100%;
  line-height: 1.5;
  margin: 0;
  -webkit-mask-image: -webkit-radial-gradient(#000, #fff);
  padding: 0;
}

.btn-53:disabled {
  cursor: default;
}

.btn-53 svg {
  display: block;
  vertical-align: middle;
}

.btn-53 [hidden] {
  display: none;
}

/* pill button look */
.btn-53 {
  border: 1px solid #d7d7d7;
  border-radius: 999px;
  display: block;
  font-weight: 900;
  overflow: hidden;
  padding: 1.1rem 3rem;
  position: relative;
  text-transform: uppercase;
  background-color: #ffffff; /* background under the sliding layer */
  color: #000;
}

/* top layer text */
.btn-53 .original {
  background: #ffffff;
  color: #000000;
  display: grid;
  inset: 0;
  place-content: center;
  position: absolute;
  transition: transform 0.25s cubic-bezier(0.87, 0, 0.13, 1);
}

/* slide the original label down on hover */
.btn-53:hover .original {
  transform: translateY(100%);
}

/* letters underneath */
.btn-53 .letters {
  display: inline-flex;
  gap: 0.05em;
}

.btn-53 span {
  opacity: 0;
  transform: translateY(-15px);
  transition:
    transform 0.25s cubic-bezier(0.87, 0, 0.13, 1),
    opacity 0.25s;
  color: #000;
}

/* alternate direction for every second letter */
.btn-53 span:nth-child(2n) {
  transform: translateY(15px);
}

/* reveal letters on hover */
.btn-53:hover span {
  opacity: 1;
  transform: translateY(0);
}

/* staggered delays for each letter of "START FREE" */
.btn-53:hover span:nth-child(2) { transition-delay: 0.05s; }
.btn-53:hover span:nth-child(3) { transition-delay: 0.10s; }
.btn-53:hover span:nth-child(4) { transition-delay: 0.15s; }
.btn-53:hover span:nth-child(5) { transition-delay: 0.20s; }
.btn-53:hover span:nth-child(6) { transition-delay: 0.25s; }
.btn-53:hover span:nth-child(7) { transition-delay: 0.30s; }
.btn-53:hover span:nth-child(8) { transition-delay: 0.35s; }
.btn-53:hover span:nth-child(9) { transition-delay: 0.40s; }
</style>

</head><body><button class="btn-53">
    <div class="original">Start Free</div>

    <div class="letters">
      <span class="">S</span>
      <span class="">T</span>
      <span class="">A</span>
      <span class="">R</span>
      <span class="">T</span>
      <span class="">F</span>
      <span class="">R</span>
      <span class="">E</span>
      <span class="">E</span>
    </div>
  </button>

</body></html>
  </div>
  
    <script>
      (function() {
        function checkAndCenter() {
          // Use double requestAnimationFrame to ensure DOM is fully painted and layout is stable
          requestAnimationFrame(function() {
            requestAnimationFrame(function() {
              const wrapper = document.querySelector('.component-wrapper');
              if (!wrapper) return;
              
              // Get all child elements
              const children = Array.from(wrapper.children);
              if (children.length === 0) return;
              
              // Temporarily override wrapper styles to shrink-wrap for measurement
              // Set inline styles to shrink-wrap (inline styles override CSS)
              wrapper.style.display = 'inline-block';
              wrapper.style.width = 'auto';
              wrapper.style.height = 'auto';
              wrapper.style.overflow = 'visible';
              wrapper.style.boxSizing = 'content-box';
              
              // Force multiple reflows to ensure styles are fully applied
              void wrapper.offsetHeight;
              void wrapper.offsetWidth;
              void wrapper.offsetHeight;
              
              // Measure the wrapper's content size
              const contentWidth = wrapper.offsetWidth;
              const contentHeight = wrapper.offsetHeight;
              
              // Restore original styles by removing inline styles we added
              wrapper.style.removeProperty('display');
              wrapper.style.removeProperty('width');
              wrapper.style.removeProperty('height');
              wrapper.style.removeProperty('overflow');
              wrapper.style.removeProperty('box-sizing');
              
              // If content is less than 500x500, center it
              if (contentWidth > 0 && contentHeight > 0 && contentWidth < 500 && contentHeight < 500) {
                wrapper.style.display = 'flex';
                wrapper.style.alignItems = 'center';
                wrapper.style.justifyContent = 'center';
              }
            });
          });
        }
        
        // Check immediately and after delays to ensure content is rendered and styled
        function runChecks() {
          checkAndCenter();
          setTimeout(checkAndCenter, 50);
          setTimeout(checkAndCenter, 150);
          setTimeout(checkAndCenter, 300);
          setTimeout(checkAndCenter, 500);
          setTimeout(checkAndCenter, 1000);
        }
        
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', runChecks);
        } else {
          runChecks();
        }
        
        // Also check when images or other resources load
        window.addEventListener('load', () => {
          setTimeout(checkAndCenter, 100);
          setTimeout(checkAndCenter, 300);
        });
        
        // Use ResizeObserver to detect size changes
        if (window.ResizeObserver) {
          setTimeout(() => {
            const wrapper = document.querySelector('.component-wrapper');
            if (wrapper) {
              const observer = new ResizeObserver(() => {
                setTimeout(checkAndCenter, 50);
              });
              observer.observe(wrapper);
            }
          }, 500);
        }
      })();
    </script>
  
</body>
</html>
