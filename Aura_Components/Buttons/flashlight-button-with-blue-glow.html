<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Component Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      height: 100%;
      overflow: auto;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000000;
      color: #ffffff;
    }
    .component-wrapper {
      width: 100%;
      height: 100%;
      padding: 0;
      box-sizing: border-box;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div class="component-wrapper">
    <html><head></head><body><div class="flex flex-wrap gap-4 reveal-on-scroll delay-300 is-visible mb-14 gap-x-4 gap-y-4 items-center justify-center">
  <style>
    /* 19. SPOTLIGHT — BLUE GLOW VERSION */
    .btn-spotlight {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.9rem 2rem;
      width: 100%;
      background: rgba(20, 20, 20, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.35);
      /* WHITE border */
      border-radius: 9999px;
      /* FULL ROUND */
      color: #aaa;
      font-size: 0.9rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      overflow: hidden;
      transition: color .3s ease, border-color .3s ease;
      backdrop-filter: blur(6px);
    }

    .btn-spotlight:hover {
      color: #fff;
      border-color: rgba(120, 180, 255, 0.6);
      /* Slight blue tint on hover */
    }

    /* BLUE spotlight beam on hover */
    .spotlight-beam {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity .35s ease-out;

      background:
        radial-gradient(circle at var(--x, 50%) var(--y, 50%),
          rgba(120, 180, 255, 0.35) 0%,
          /* bright blue center */
          rgba(80, 140, 255, 0.18) 22%,
          /* soft fade */
          rgba(0, 0, 0, 0.0) 55%);
    }

    .btn-spotlight:hover .spotlight-beam {
      opacity: 1;
    }
  </style>

  <div class="btn-wrapper rounded-full" style="max-width:260px">
    <button class="btn-spotlight btn-size-2 rounded-full" id="spotBtn">
    <div class="spotlight-beam"></div>
    <span style="position:relative; pointer-events:none;">Join Waitlist</span>
  </button>
  </div>

  <script>
    /* Mouse-tracking spotlight */
const spotBtn = document.getElementById("spotBtn");

spotBtn.addEventListener("mousemove", (e) => {
  const rect = spotBtn.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  spotBtn.style.setProperty("--x", `${x}px`);
  spotBtn.style.setProperty("--y", `${y}px`);
});
  </script></div></body></html>
  </div>
  
    <script>
      (function() {
        function checkAndCenter() {
          // Use double requestAnimationFrame to ensure DOM is fully painted and layout is stable
          requestAnimationFrame(function() {
            requestAnimationFrame(function() {
              const wrapper = document.querySelector('.component-wrapper');
              if (!wrapper) return;
              
              // Get all child elements
              const children = Array.from(wrapper.children);
              if (children.length === 0) return;
              
              // Temporarily override wrapper styles to shrink-wrap for measurement
              // Set inline styles to shrink-wrap (inline styles override CSS)
              wrapper.style.display = 'inline-block';
              wrapper.style.width = 'auto';
              wrapper.style.height = 'auto';
              wrapper.style.overflow = 'visible';
              wrapper.style.boxSizing = 'content-box';
              
              // Force multiple reflows to ensure styles are fully applied
              void wrapper.offsetHeight;
              void wrapper.offsetWidth;
              void wrapper.offsetHeight;
              
              // Measure the wrapper's content size
              const contentWidth = wrapper.offsetWidth;
              const contentHeight = wrapper.offsetHeight;
              
              // Restore original styles by removing inline styles we added
              wrapper.style.removeProperty('display');
              wrapper.style.removeProperty('width');
              wrapper.style.removeProperty('height');
              wrapper.style.removeProperty('overflow');
              wrapper.style.removeProperty('box-sizing');
              
              // If content is less than 500x500, center it
              if (contentWidth > 0 && contentHeight > 0 && contentWidth < 500 && contentHeight < 500) {
                wrapper.style.display = 'flex';
                wrapper.style.alignItems = 'center';
                wrapper.style.justifyContent = 'center';
              }
            });
          });
        }
        
        // Check immediately and after delays to ensure content is rendered and styled
        function runChecks() {
          checkAndCenter();
          setTimeout(checkAndCenter, 50);
          setTimeout(checkAndCenter, 150);
          setTimeout(checkAndCenter, 300);
          setTimeout(checkAndCenter, 500);
          setTimeout(checkAndCenter, 1000);
        }
        
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', runChecks);
        } else {
          runChecks();
        }
        
        // Also check when images or other resources load
        window.addEventListener('load', () => {
          setTimeout(checkAndCenter, 100);
          setTimeout(checkAndCenter, 300);
        });
        
        // Use ResizeObserver to detect size changes
        if (window.ResizeObserver) {
          setTimeout(() => {
            const wrapper = document.querySelector('.component-wrapper');
            if (wrapper) {
              const observer = new ResizeObserver(() => {
                setTimeout(checkAndCenter, 50);
              });
              observer.observe(wrapper);
            }
          }, 500);
        }
      })();
    </script>
  
</body>
</html>
